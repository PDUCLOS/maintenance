# Base vectorielle ChromaDB (mode serveur). Version alignée sur le client
# Linux de requirements.txt (chromadb 0.6.3).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels: { app: chroma }
  template:
    metadata:
      labels: { app: chroma }
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:0.6.3
          ports:
            - containerPort: 8000
          env:
            - { name: IS_PERSISTENT, value: "TRUE" }
            - { name: PERSIST_DIRECTORY, value: /chroma/chroma }
            - { name: ANONYMIZED_TELEMETRY, value: "False" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          readinessProbe:
            httpGet: { path: /api/v1/heartbeat, port: 8000 }
            periodSeconds: 10
          volumeMounts:
            - { name: chroma-data, mountPath: /chroma/chroma }
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
spec:
  selector: { app: chroma }
  ports:
    - port: 8000
      targetPort: 8000
