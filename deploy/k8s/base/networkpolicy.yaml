# Moindre privilège réseau : Chroma et Ollama ne sont joignables que depuis
# les pods du namespace (API, UI, Jobs), jamais depuis l'extérieur.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backends-from-namespace-only
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [chroma, ollama] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
