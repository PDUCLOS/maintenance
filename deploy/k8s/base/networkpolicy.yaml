# Moindre privilège réseau : Chroma et Ollama ne sont joignables que depuis
# les pods du namespace (API, UI, Jobs), jamais depuis l'extérieur.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backends-from-namespace-only
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [chroma, ollama] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
# L'API expose aussi /ingest et /eval (actions coûteuses, sans authentification
# applicative) : seuls l'interface Streamlit et le scrapeur Prometheus
# (namespace étiqueté monitoring) peuvent la joindre. L'Ingress public ne
# route que vers l'interface.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-ui-and-monitoring
spec:
  podSelector:
    matchLabels: { app: copilot-api }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: copilot-ui }
      ports:
        - { port: 8000, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8000, protocol: TCP }
